  - nom: Leg curl
    categorie: Jambes
    muscles: { "Biceps fémoral": 100, "Semi-tendineux": 100, "Semi-membraneux": 100, "Gastrocnémien": 45, "Sartorius": 30, "Gracile": 30, "Plantaire grêle": 15 }
  - nom: Leg extension
    categorie: Jambes
    muscles: { "Droit fémoral": 100, "Vaste latéral": 100, "Vaste médial": 100, "Vaste intermédiaire": 100 }
  - nom: Mollets debout
    categorie: Jambes
    muscles: { "Gastrocnémien": 100, "Soléaire": 70, "Plantaire grêle": 40, "Tibial postérieur": 40, "Fibulaire long": 35, "Fibulaire court": 35, "Long fléchisseur des orteils": 35, "Long fléchisseur de l'hallux": 35 }
