    categorie: Tronc
    muscles: { "Transverse de l'abdomen": 100, "Droit de l'abdomen": 85, "Oblique externe": 70, "Oblique interne": 65, "Multifides": 45, "Érecteurs du rachis": 40, "Deltoïde antérieur": 40, "Grand fessier": 40, "Carré des lombes": 35, "Droit fémoral": 30, "Grand pectoral": 25, "Trapèze": 20 }
