    categorie: Escalade
    muscles: { "Groupe des fléchisseurs du poignet et des doigts": 100, "Grand dorsal": 50, "Trapèze": 40, "Supra-épineux": 40, "Droit de l'abdomen": 35, "Grand rond": 35, "Brachio-radial": 30, "Infra-épineux": 30, "Biceps brachial": 25, "Brachial": 25, "Petit pectoral": 20 }
  - nom: Bloc (escalade)
    categorie: Escalade
    muscles: { "Groupe des fléchisseurs du poignet et des doigts": 85, "Grand dorsal": 85, "Biceps brachial": 75, "Brachial": 70, "Grand rond": 65, "Droit de l'abdomen": 65, "Brachio-radial": 60, "Grand fessier": 60, "Oblique externe": 55, "Transverse de l'abdomen": 55, "Trapèze": 55, "Vaste latéral": 55, "Vaste médial": 55, "Droit fémoral": 50, "Biceps fémoral": 50, "Oblique interne": 45, "Rhomboïde majeur": 45, "Deltoïde postérieur": 45, "Gastrocnémien": 45, "Groupe des extenseurs du poignet et des doigts": 45, "Semi-tendineux": 40, "Semi-membraneux": 40, "Soléaire": 40, "Long fléchisseur des orteils": 40, "Long fléchisseur de l'hallux": 40, "Triceps brachial": 35, "Tibial antérieur": 30 }

