    muscles: { "Grand fessier": 95, "Érecteurs du rachis": 90, "Biceps fémoral": 85, "Semi-tendineux": 80, "Semi-membraneux": 80, "Groupe des fléchisseurs du poignet et des doigts": 80, "Trapèze": 70, "Vaste latéral": 60, "Vaste médial": 60, "Vaste intermédiaire": 60, "Grand adducteur": 60, "Grand dorsal": 60, "Multifides": 60, "Trapèze supérieur": 55, "Carré des lombes": 50, "Transverse de l'abdomen": 50, "Rhomboïde majeur": 45, "Rhomboïde mineur": 40, "Droit fémoral": 40, "Moyen fessier": 35, "Droit de l'abdomen": 30, "Deltoïde postérieur": 30, "Soléaire": 25, "Gastrocnémien": 25 }
  - nom: Soulevé de terre roumain
    categorie: Jambes
    muscles: { "Biceps fémoral": 100, "Semi-tendineux": 95, "Semi-membraneux": 95, "Grand fessier": 90, "Érecteurs du rachis": 75, "Grand adducteur": 50, "Groupe des fléchisseurs du poignet et des doigts": 55, "Multifides": 45, "Trapèze": 45, "Grand dorsal": 40, "Carré des lombes": 35, "Gastrocnémien": 20 }
  - nom: Fentes
    categorie: Jambes
    muscles: { "Vaste latéral": 85, "Vaste médial": 85, "Vaste intermédiaire": 85, "Grand fessier": 85, "Droit fémoral": 70, "Moyen fessier": 60, "Grand adducteur": 55, "Petit fessier": 40, "Long adducteur": 40, "Biceps fémoral": 35, "Semi-tendineux": 35, "Semi-membraneux": 35, "Tenseur du fascia lata": 35, "Soléaire": 30, "Gastrocnémien": 25, "Transverse de l'abdomen": 25, "Oblique externe": 20 }
  - nom: Presse à cuisses
    categorie: Jambes
    muscles: { "Vaste latéral": 90, "Vaste médial": 90, "Vaste intermédiaire": 90, "Droit fémoral": 70, "Grand fessier": 65, "Grand adducteur": 50, "Biceps fémoral": 25, "Semi-tendineux": 25, "Semi-membraneux": 25, "Soléaire": 20, "Gastrocnémien": 20 }
  - nom: Hip thrust
