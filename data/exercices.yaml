    categorie: Tronc
    muscles: { "Droit de l'abdomen": 100, "Oblique externe": 40, "Oblique interne": 35, "Transverse de l'abdomen": 30, "Droit fémoral": 10 }
  - nom: Relevé de jambes
    categorie: Tronc
    muscles: { "Droit de l'abdomen": 85, "Droit fémoral": 70, "Tenseur du fascia lata": 45, "Sartorius": 45, "Transverse de l'abdomen": 45, "Pectiné": 40, "Oblique externe": 40, "Long adducteur": 25 }
